<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра — Говорю правильно</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-card: rgba(26, 30, 60, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --purple: #7c3aed;
            --purple-dark: #5b21b6;
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        /* ========================================================
           МОДАЛЬНОЕ ОКНО НАСТРОЙКИ
           ======================================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }

        .setup-card {
            background: var(--bg-card); border: 1px solid var(--glass-border);
            border-radius: var(--radius); padding: 30px; width: 100%;
            max-width: 520px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-height: 90vh;
            overflow-y: auto;
        }

        .setup-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; text-align: center; color: var(--gold); }
        .player-count-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-count {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; font-weight: 600;
        }
        .btn-count.active { background: var(--purple); border-color: var(--purple); }

        .player-inputs { display: flex; flex-direction: column; gap: 16px; margin-bottom: 25px; }

        .player-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }

        .player-input-group .player-color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .player-input-group .player-avatar-select {
            font-size: 1.3rem;
            padding: 4px 10px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            color: #fff;
            font-family: inherit;
            flex-shrink: 0;
            min-width: 50px;
        }

        .player-input-group .player-avatar-select option {
            background: #1e293b;
            color: #fff;
            font-size: 1.2rem;
            padding: 4px;
        }

        .player-input-group .player-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-family: inherit;
            min-width: 100px;
        }

        .player-input-group .player-input::placeholder {
            color: var(--text-muted);
        }

        .btn-start {
            width: 100%; padding: 14px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            color: #fff; font-weight: 700; font-size: 1.1rem; cursor: pointer;
            transition: var(--transition);
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); }

        /* ========================================================
           ИГРОВОЙ СТОЛ
           ======================================================== */
        .board-container {
            display: grid; grid-template-columns: 1fr 380px; gap: 20px;
            max-width: 1600px; margin: 0 auto;
        }

        .game-map-area {
            position: relative; border-radius: var(--radius); overflow: hidden;
            border: 1px solid var(--glass-border); background: var(--bg-card);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); height: fit-content;
        }

        .map-image { width: 100%; display: block; user-select: none; }
        .map-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .map-marker {
            position: absolute; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; z-index: 2;
            pointer-events: none;
        }
        .marker-dot {
            width: 18px; height: 18px; border-radius: 50%; background: rgba(124, 58, 237, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2); display: flex;
            align-items: center; justify-content: center; font-size: 0.55rem;
            font-weight: 700; color: rgba(255,255,255,0.6);
        }
        .marker-dot.special { background: rgba(245, 158, 11, 0.5); border-color: var(--gold); color: var(--gold); }
        .marker-dot.finish { background: rgba(239, 68, 68, 0.6); border-color: var(--red); color: #fff; }
        .marker-dot.fire { background: rgba(239, 68, 68, 0.4); border-color: #f97316; color: #f97316; }

        /* Фишки игроков */
        .player-chip {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #fff;
            z-index: 5;
            box-shadow: 0 0 12px rgba(0,0,0,0.8);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, left, top;
            background-size: cover;
            background-position: center;
        }
        .player-chip .chip-avatar {
            font-size: 1.2rem;
            line-height: 1;
        }
        .player-chip.active-player {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
            animation: bounce 0.8s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -60%) scale(1.08); }
        }

        .game-panel {
            background: var(--bg-card); backdrop-filter: blur(30px);
            border-radius: var(--radius); border: 1px solid var(--glass-border);
            padding: 25px; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .panel-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
        }

        .panel-top .exit-btn, .panel-top .reset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            padding: 4px 12px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }
        .panel-top .exit-btn:hover { color: var(--red); background: rgba(239, 68, 68, 0.1); }
        .panel-top .reset-btn:hover { color: var(--gold); background: rgba(245, 158, 11, 0.1); }

        .turn-indicator {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm); padding: 12px; display: flex;
            align-items: center; gap: 12px;
        }
        .current-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 1.3rem;
            background-size: cover;
            background-position: center;
        }
        .turn-info { flex: 1; }
        .turn-info .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .turn-info .name { font-weight: 600; }

        /* ========================================================
           КУБИК
           ======================================================== */
        .dice-area {
            background: rgba(255, 255, 255, 0.03); border-radius: var(--radius-sm);
            padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid var(--glass-border); flex-wrap: wrap; gap: 12px;
        }

        .cube-wrapper { width: 60px; height: 60px; perspective: 600px; flex-shrink: 0; }
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        .cube-face {
            position: absolute; width: 60px; height: 60px; background: #fff;
            border: 2px solid #cbd5e1; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; box-shadow: inset 0 0 8px rgba(0,0,0,0.1);
        }
        .cube-face.front  { transform: rotateY(0deg) translateZ(30px); }
        .cube-face.back   { transform: rotateY(180deg) translateZ(30px); }
        .cube-face.right  { transform: rotateY(90deg) translateZ(30px); }
        .cube-face.left   { transform: rotateY(-90deg) translateZ(30px); }
        .cube-face.top    { transform: rotateX(90deg) translateZ(30px); }
        .cube-face.bottom { transform: rotateX(-90deg) translateZ(30px); }

        .pip-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 40px;
            height: 40px;
            gap: 2px;
        }
        .pip {
            background: #1e293b;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            align-self: center;
            justify-self: center;
        }
        .pip-grid .pip-center { grid-area: 2/2; }
        .pip-grid .pip-top-left { grid-area: 1/1; }
        .pip-grid .pip-top-right { grid-area: 1/3; }
        .pip-grid .pip-bottom-left { grid-area: 3/1; }
        .pip-grid .pip-bottom-right { grid-area: 3/3; }
        .pip-grid .pip-middle-left { grid-area: 2/1; }
        .pip-grid .pip-middle-right { grid-area: 2/3; }
        .pip-grid .pip-top-middle { grid-area: 1/2; }
        .pip-grid .pip-bottom-middle { grid-area: 3/2; }

        .dice-result { font-size: 0.85rem; color: var(--text-secondary); text-align: center; }
        .dice-result strong { color: var(--gold); font-size: 1.2rem; }

        .btn-roll {
            padding: 10px 22px; border: none; border-radius: 40px;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            color: #fff; font-weight: 600; cursor: pointer; transition: var(--transition);
            font-family: inherit;
        }
        .btn-roll:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); }
        .btn-roll:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ========================================================
           ЗАДАНИЯ
           ======================================================== */
        .task-area {
            background: rgba(255, 255, 255, 0.03); border-radius: var(--radius-sm);
            padding: 14px 16px; border: 1px solid var(--glass-border); min-height: 140px;
        }
        .task-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .task-card {
            background: rgba(0, 0, 0, 0.3); border-radius: var(--radius-sm);
            padding: 12px 14px; border-left: 4px solid var(--purple); margin: 8px 0 12px;
        }
        .task-name { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
        .task-desc { color: var(--text-secondary); font-size: 0.85rem; line-height: 1.4; }

        .task-actions { display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 10px; border: none; border-radius: 30px;
            font-weight: 600; cursor: pointer; transition: var(--transition); color: #fff;
            font-family: inherit;
        }
        .btn-success { background: var(--green); }
        .btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-danger { background: var(--red); }
        .btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-action:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        /* ========================================================
           ЛОГ
           ======================================================== */
        .game-log {
            background: rgba(255, 255, 255, 0.02); border-radius: var(--radius-sm);
            padding: 10px 14px; max-height: 110px; overflow-y: auto; font-size: 0.85rem;
            color: var(--text-secondary); border: 1px solid var(--glass-border);
        }
        .game-log .log-entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .game-log .log-entry:last-child { border-bottom: none; }
        .game-log .highlight { color: var(--gold); font-weight: 600; }
        .game-log .success { color: var(--green); }
        .game-log .fail { color: var(--red); }

        .achievement-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            border: 2px solid var(--gold);
            border-radius: var(--radius);
            padding: 16px 28px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.5s ease-out;
            max-width: 90%;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .achievement-toast .icon { font-size: 2rem; }
        .achievement-toast .text { font-weight: 600; }
        .achievement-toast .sub { font-size: 0.8rem; color: var(--text-muted); }

        @media (max-width: 900px) {
            .board-container { grid-template-columns: 1fr; }
            .game-panel { max-height: none; }
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .game-panel { padding: 16px; }
            .dice-area { flex-direction: column; align-items: stretch; }
            .btn-roll { width: 100%; justify-content: center; }
            .task-actions { flex-direction: column; }
            .panel-top { flex-direction: column; align-items: stretch; }
            .player-input-group { flex-wrap: wrap; }
            .setup-card { padding: 20px; }
        }
    </style>
</head>
<body>

<!-- ========================================================
   МОДАЛЬНОЕ ОКНО НАСТРОЙКИ
   ======================================================== -->
<div class="modal-overlay" id="setupModal">
    <div class="setup-card">
        <div class="setup-title">🎲 Настройка игры</div>
        <div style="font-size:0.9rem; color:var(--text-muted); margin-bottom:10px;">Выберите количество игроков:</div>
        <div class="player-count-btns">
            <button class="btn-count active" onclick="setPlayerCount(1)">1</button>
            <button class="btn-count" onclick="setPlayerCount(2)">2</button>
            <button class="btn-count" onclick="setPlayerCount(3)">3</button>
            <button class="btn-count" onclick="setPlayerCount(4)">4</button>
        </div>
        <div class="player-inputs" id="playerInputs"></div>
        <button class="btn-start" onclick="startGame()">🚀 Начать игру</button>
    </div>
</div>

<!-- ========================================================
   ИГРОВОЙ СТОЛ
   ======================================================== -->
<div class="board-container">
    <div class="game-map-area">
        <img src="images/map.png" alt="Карта игры" class="map-image" id="mapImage">
        <div class="map-overlay" id="mapOverlay"></div>
    </div>

    <div class="game-panel">
        <div class="panel-top">
            <div style="font-size:0.8rem; color:var(--text-muted);">
                <i class="fas fa-gamepad"></i> Игра
            </div>
            <div style="display:flex; gap:8px;">
                <button class="reset-btn" onclick="resetGame()" title="Начать новую игру">
                    <i class="fas fa-redo"></i> Новая игра
                </button>
                <button class="exit-btn" onclick="exitGame()" title="Выйти из игры">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>
        </div>

        <div class="turn-indicator">
            <div class="current-avatar" id="currentAvatar">👤</div>
            <div class="turn-info">
                <div class="label">Сейчас ходит</div>
                <div class="name" id="currentPlayerName">Игрок 1</div>
            </div>
            <div style="font-size:0.8rem; color:var(--text-muted);">
                Клетка: <strong id="currentCellDisplay" style="color:var(--gold);">1</strong>/89
            </div>
        </div>

        <div class="dice-area">
            <div style="display:flex; align-items:center; gap:16px;">
                <div class="cube-wrapper">
                    <div class="cube" id="cube">
                        <div class="cube-face front">
                            <div class="pip-grid">
                                <div></div><div></div><div></div>
                                <div></div><div class="pip pip-center"></div><div></div>
                                <div></div><div></div><div></div>
                            </div>
                        </div>
                        <div class="cube-face back">
                            <div class="pip-grid">
                                <div class="pip pip-top-left"></div><div></div><div></div>
                                <div></div><div></div><div></div>
                                <div></div><div></div><div class="pip pip-bottom-right"></div>
                            </div>
                        </div>
                        <div class="cube-face right">
                            <div class="pip-grid">
                                <div class="pip pip-top-left"></div><div></div><div></div>
                                <div></div><div class="pip pip-center"></div><div></div>
                                <div></div><div></div><div class="pip pip-bottom-right"></div>
                            </div>
                        </div>
                        <div class="cube-face left">
                            <div class="pip-grid">
                                <div class="pip pip-top-left"></div><div></div><div class="pip pip-top-right"></div>
                                <div></div><div></div><div></div>
                                <div class="pip pip-bottom-left"></div><div></div><div class="pip pip-bottom-right"></div>
                            </div>
                        </div>
                        <div class="cube-face top">
                            <div class="pip-grid">
                                <div class="pip pip-top-left"></div><div></div><div class="pip pip-top-right"></div>
                                <div></div><div class="pip pip-center"></div><div></div>
                                <div class="pip pip-bottom-left"></div><div></div><div class="pip pip-bottom-right"></div>
                            </div>
                        </div>
                        <div class="cube-face bottom">
                            <div class="pip-grid">
                                <div class="pip pip-top-left"></div><div></div><div class="pip pip-top-right"></div>
                                <div class="pip pip-middle-left"></div><div></div><div class="pip pip-middle-right"></div>
                                <div class="pip pip-bottom-left"></div><div></div><div class="pip pip-bottom-right"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="dice-result">
                    <div style="font-size:0.7rem; color:var(--text-muted);">Выпало</div>
                    <strong id="diceValue">—</strong>
                </div>
            </div>
            <button class="btn-roll" id="rollBtn" onclick="rollDice()">
                <i class="fas fa-dice"></i> Бросить
            </button>
        </div>

        <div class="task-area">
            <div class="task-label"><i class="fas fa-tasks"></i> Текущее задание</div>
            <div class="task-card">
                <div class="task-name" id="taskName">Бросьте кубик</div>
                <div class="task-desc" id="taskDesc">Сделайте ход, чтобы получить упражнение.</div>
            </div>
            <div class="task-actions">
                <button class="btn-action btn-success" id="btnWin" onclick="completeTask(true)" disabled>
                    <i class="fas fa-check"></i> Выполнено
                </button>
                <button class="btn-action btn-danger" id="btnFail" onclick="completeTask(false)" disabled>
                    <i class="fas fa-times"></i> Не выполнено
                </button>
            </div>
        </div>

        <div class="game-log" id="gameLog">
            <div class="log-entry">🎮 Игра начинается! Бросьте кубик.</div>
        </div>
    </div>
</div>

<!-- ========================================================
   JAVASCRIPT
   ======================================================== -->
<script>
// ========================================================
// ЗВУКИ
// ========================================================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playDiceSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const delays = [0, 80, 170, 270, 390, 530, 700, 900];
    delays.forEach((delay, index) => {
        setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200 - (index * 15), audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3 - (index * 0.03), audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }, delay);
    });
}

function playFanfareSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [
        { freq: 261.63, duration: 0.15, delay: 0 },
        { freq: 329.63, duration: 0.15, delay: 150 },
        { freq: 392.00, duration: 0.15, delay: 300 },
        { freq: 523.25, duration: 0.6,  delay: 450 }
    ];
    notes.forEach(note => {
        setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + note.duration);
        }, note.delay);
    });
}

function playCampfireSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const delays = [0, 100, 250, 350, 500, 600, 750, 850, 1000];
    delays.forEach((delay) => {
        setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = 100 + Math.random() * 80;
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15 + Math.random() * 0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }, delay);
    });
}

const PLAYER_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'];

let players = [];

let selectedCount = 1;
let canRoll = true;
let isGameFinished = false;
let isProcessing = false;
let isMoving = false;
let achievements = [];
let animationQueue = [];

// ========================================================
// НАСТРОЙКА ИГРЫ
// ========================================================
function setPlayerCount(count) {
    selectedCount = count;
    document.querySelectorAll('.btn-count').forEach((b, i) => {
        b.classList.toggle('active', i + 1 === count);
    });
    renderInputs();
}

function renderInputs() {
    const container = document.getElementById('playerInputs');
    container.innerHTML = '';
    for (let i = 0; i < selectedCount; i++) {
        const avatarOptions = AVATARS.map(a => 
            `<option value="${a}">${a}</option>`
        ).join('');
        container.innerHTML += `
            <div class="player-input-group">
                <div class="player-color-dot" style="background:${PLAYER_COLORS[i]}"></div>
                <select class="player-avatar-select" id="pAvatar${i}">
                    ${avatarOptions}
                </select>
                <input type="text" class="player-input" id="pName${i}" value="Игрок ${i + 1}" placeholder="Имя игрока">
            </div>
        `;
        document.getElementById(`pAvatar${i}`).selectedIndex = i % AVATARS.length;
    }
}

function startGame() {
    players = [];
    for (let i = 0; i < selectedCount; i++) {
        const name = document.getElementById(`pName${i}`).value || `Игрок ${i + 1}`;
        const avatar = document.getElementById(`pAvatar${i}`).value || AVATARS[i % AVATARS.length];
        players.push({ 
            id: i, 
            name, 
            avatar,
            cell: 0, 
            color: PLAYER_COLORS[i], 
            tasksCompleted: 0 
        });
    }
    achievements = [];
    isGameFinished = false;
    activePlayerIndex = 0;
    document.getElementById('setupModal').style.display = 'none';
    localStorage.removeItem('speech_game_state');
    renderStaticMap();
    updateAllChips();
    updateTurnUI();
    addLog('🎮 Игра началась! Бросьте кубик.');
}

function continueGame() {
    document.getElementById('setupModal').style.display = 'none';
    renderStaticMap();
    updateAllChips();
    updateTurnUI();
    addLog('📂 Игра загружена! Продолжайте играть.');
}

function updateAllChips() {
    document.querySelectorAll('.player-chip').forEach(c => c.remove());
    const overlay = document.getElementById('mapOverlay');
    
    players.forEach((p, idx) => {
        const pt = MAP_POINTS[p.cell];
        if (!pt) return;
        const chip = document.createElement('div');
        chip.className = `player-chip${idx === activePlayerIndex && !isGameFinished ? ' active-player' : ''}`;
        const offset = (idx - (players.length - 1) / 2) * 16;
        chip.style.left = `calc(${pt.x}% + ${offset}px)`;
        chip.style.top = `calc(${pt.y}% - ${offset}px)`;
        chip.style.background = p.color;
        chip.innerHTML = `<span class="chip-avatar">${p.avatar}</span>`;
        chip.title = `${p.name} (Клетка ${p.cell + 1})`;
        overlay.appendChild(chip);
    });
}

function updateTurnUI() {
    if (isGameFinished || players.length === 0) return;
    const p = players[activePlayerIndex];
    document.getElementById('currentAvatar').style.background = p.color;
    document.getElementById('currentAvatar').textContent = p.avatar;
    document.getElementById('currentPlayerName').textContent = p.name;
    document.getElementById('currentCellDisplay').textContent = p.cell + 1;
    updateAllChips();
}

// ========================================================
// ПЛАВНОЕ ПЕРЕМЕЩЕНИЕ ПО КЛЕТКАМ (ПОШАГОВО)
// ========================================================
function moveChipStepByStep(playerIndex, fromCell, toCell, callback) {
    if (fromCell === toCell) {
        if (callback) callback();
        return;
    }
    
    const overlay = document.getElementById('mapOverlay');
    const chips = overlay.querySelectorAll('.player-chip');
    let chip = null;
    
    // Находим фишку по цвету
    const p = players[playerIndex];
    for (const c of chips) {
        if (c.style.background === p.color || c.style.background === `rgb(${parseInt(p.color.slice(1,3), 16)}, ${parseInt(p.color.slice(3,5), 16)}, ${parseInt(p.color.slice(5,7), 16)})`) {
            chip = c;
            break;
        }
    }
    
    if (!chip) {
        if (callback) callback();
        return;
    }
    
    const offset = (playerIndex - (players.length - 1) / 2) * 16;
    let currentStep = fromCell;
    const stepSize = fromCell < toCell ? 1 : -1;
    const steps = Math.abs(toCell - fromCell);
    let completedSteps = 0;
    
    function doStep() {
        if (completedSteps >= steps) {
            // Финальная позиция
            const finalPt = MAP_POINTS[toCell];
            chip.style.left = `calc(${finalPt.x}% + ${offset}px)`;
            chip.style.top = `calc(${finalPt.y}% - ${offset}px)`;
            if (callback) callback();
            return;
        }
        
        currentStep += stepSize;
        const pt = MAP_POINTS[currentStep];
        if (pt) {
            chip.style.left = `calc(${pt.x}% + ${offset}px)`;
            chip.style.top = `calc(${pt.y}% - ${offset}px)`;
        }
        completedSteps++;
        
        // Скорость анимации: быстрее для коротких расстояний, медленнее для длинных
        const delay = Math.min(150, 80 + steps * 5);
        setTimeout(doStep, delay);
    }
    
    // Запускаем пошаговое движение
    doStep();
}

function rollDice() {
    if (!canRoll || isGameFinished || isProcessing || isMoving || players.length === 0) return;
    isProcessing = true;
    canRoll = false;
    document.getElementById('rollBtn').disabled = true;
    document.getElementById('btnWin').disabled = true;
    document.getElementById('btnFail').disabled = true;
    
    playDiceSound();
    
    const cube = document.getElementById('cube');
    const result = Math.floor(Math.random() * 6) + 1;
    
    const rotations = {
        1: { x: 0, y: 0 },
        2: { x: 0, y: 180 },
        3: { x: 0, y: -90 },
        4: { x: 0, y: 90 },
        5: { x: -90, y: 0 },
        6: { x: 90, y: 0 }
    };
    
    const extraRoundsX = (Math.floor(Math.random() * 3) + 3) * 360;
    const extraRoundsY = (Math.floor(Math.random() * 3) + 3) * 360;
    
    cube.style.transform = `rotateX(${rotations[result].x + extraRoundsX}deg) rotateY(${rotations[result].y + extraRoundsY}deg)`;
    document.getElementById('diceValue').textContent = result;
    
    setTimeout(() => {
        moveCurrentPlayer(result);
    }, 1200);
}

// ========================================================
// ПЕРЕМЕЩЕНИЕ ИГРОКА
// ========================================================
function moveCurrentPlayer(steps) {
    const p = players[activePlayerIndex];
    const oldCell = p.cell;
    let newCell = oldCell + steps;
    let extraMessage = '';
    let isSpecialMove = false;
    
    // Проверка на финиш
    if (newCell >= MAP_POINTS.length - 1) {
        newCell = MAP_POINTS.length - 1;
        isGameFinished = true;
        p.cell = newCell;
        
        isMoving = true;
        moveChipStepByStep(activePlayerIndex, oldCell, newCell, () => {
            updateAllChips();
            updateTurnUI();
            playFanfareSound();
            addLog(`🏆 <span class="highlight">${p.name} ПОБЕДИЛ!</span>`);
            document.getElementById('taskName').textContent = '🏆 ПОБЕДА!';
            document.getElementById('taskDesc').textContent = `${p.name} первым добрался до финиша!`;
            document.getElementById('rollBtn').disabled = true;
            
            if (!achievements.includes('winner')) {
                achievements.push('winner');
                showAchievementToast('👑', 'Победитель', `${p.name} выиграл игру!`);
            }
            isMoving = false;
            isProcessing = false;
        });
        return;
    }
    
    // ОСОБЫЕ КЛЕТКИ (правильная логика)
    // Клетка 16 (индекс 15) → Переправа → клетка 20 (индекс 19)
    if (newCell === 15) {
        extraMessage = `🌀 Переправа! Перемещение на клетку 20`;
        newCell = 19;
        isSpecialMove = true;
    }
    // Клетка 18 (индекс 17) → Живот гиганта → клетка 22 (индекс 21)
    else if (newCell === 17) {
        extraMessage = `🌀 Живот гиганта! Перемещение на клетку 22 (пляж)`;
        newCell = 21;
        isSpecialMove = true;
    }
    
    // Проверка на костёр (клетка 32, индекс 31)
    const isCampfire = (newCell === 31);
    
    p.cell = newCell;
    
    // Плавное пошаговое перемещение
    isMoving = true;
    moveChipStepByStep(activePlayerIndex, oldCell, newCell, () => {
        updateAllChips();
        updateTurnUI();
        
        if (extraMessage) {
            addLog(`🌀 <span class="highlight">${extraMessage}</span>`);
        }
        
        addLog(`🎲 ${p.name} выбросил <span class="highlight">${steps}</span> → клетка <span class="highlight">${p.cell + 1}</span>`);
        
        // Если клетка с костром — бонусный ход
        if (isCampfire) {
            playCampfireSound();
            addLog(`🔥 <span class="highlight">Костёр!</span> ${p.name} получает дополнительный ход!`);
            setTimeout(() => {
                canRoll = true;
                document.getElementById('rollBtn').disabled = false;
                document.getElementById('taskName').textContent = 'Бонусный ход!';
                document.getElementById('taskDesc').textContent = `${p.name} может бросить кубик ещё раз!`;
                isMoving = false;
                isProcessing = false;
            }, 600);
            return;
        }
        
        // Показываем задание
        setTimeout(() => {
            showTask();
            isMoving = false;
        }, 300);
    });
}

        setTimeout(() => {
            nextTurn();
            isProcessing = false;
        }, 600);
        
    } else {
        addLog(`❌ <span class="fail">${p.name} не выполнил задание.</span> Возврат на 2 клетки.`);
        const oldCell = p.cell;
        const newCell = Math.max(0, p.cell - 2);
        p.cell = newCell;
        
        isMoving = true;
        moveChipStepByStep(activePlayerIndex, oldCell, newCell, () => {
            updateAllChips();
            updateTurnUI();
            addLog(`↩️ ${p.name} перешёл на клетку ${p.cell + 1}`);
            setTimeout(() => {
                nextTurn();
                isMoving = false;
                isProcessing = false;
            }, 400);
        });
    }
}

function nextTurn() {
    if (isGameFinished) return;
    activePlayerIndex = (activePlayerIndex + 1) % players.length;
    updateTurnUI();
    canRoll = true;
    document.getElementById('rollBtn').disabled = false;
    document.getElementById('taskName').textContent = 'Бросьте кубик';
    document.getElementById('taskDesc').textContent = 'Сделайте ход, чтобы получить упражнение.';
    document.getElementById('diceValue').textContent = '—';
    saveGameState();
}

// ========================================================
// СОХРАНЕНИЕ ПРОГРЕССА
// ========================================================
function saveGameState() {
    try {
        const state = {
            players: players.map(p => ({ ...p })),
            activePlayerIndex: activePlayerIndex,
            isGameFinished: isGameFinished,
            achievements: achievements,
            savedAt: new Date().toISOString()
        };
        localStorage.setItem('speech_game_state', JSON.stringify(state));
    } catch(e) {}
}

function loadGameState() {
    try {
        const raw = localStorage.getItem('speech_game_state');
        if (!raw) return false;
        const state = JSON.parse(raw);
        if (state.players && state.players.length > 0) {
            players = state.players;
            activePlayerIndex = state.activePlayerIndex || 0;
            isGameFinished = state.isGameFinished || false;
            achievements = state.achievements || [];
            return true;
        }
    } catch(e) {}
    return false;
}

function clearGameState() {
    localStorage.removeItem('speech_game_state');
}

// ========================================================
// ДОСТИЖЕНИЯ
// ========================================================
function showAchievementToast(icon, name, desc) {
    const existing = document.querySelector('.achievement-toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'achievement-toast';
    toast.innerHTML = `
        <span class="icon">${icon}</span>
        <div>
            <div class="text">${name}</div>
            <div class="sub">${desc}</div>
        </div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        if (toast.parentElement) toast.remove();
    }, 4000);
}

// ========================================================
// ВЫХОД И НОВАЯ ИГРА
// ========================================================
function exitGame() {
    if (confirm('Вы уверены, что хотите выйти? Прогресс сохранится.')) {
        saveGameState();
        window.close();
    }
}

function resetGame() {
    if (confirm('Начать новую игру? Текущий прогресс будет потерян.')) {
        clearGameState();
        location.reload();
    }
}

// ========================================================
// ЛОГ
// ========================================================
function addLog(text) {
    const log = document.getElementById('gameLog');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = text;
    log.prepend(entry);
    while (log.children.length > 50) {
        log.removeChild(log.lastChild);
    }
}

// ========================================================
// ЗАПУСК
// ========================================================
document.addEventListener('DOMContentLoaded', function() {
    const hasSavedGame = loadGameState();
    
    if (hasSavedGame && players.length > 0) {
        const modal = document.getElementById('setupModal');
        modal.querySelector('.setup-title').textContent = '📂 Продолжить игру?';
        modal.querySelector('.player-count-btns').style.display = 'none';
        modal.querySelector('.player-inputs').style.display = 'none';
        modal.querySelector('.btn-start').textContent = '✅ Продолжить игру';
        modal.querySelector('.btn-start').onclick = function() {
            continueGame();
        };
        const resetBtn = document.createElement('button');
        resetBtn.className = 'btn-start';
        resetBtn.style.marginTop = '10px';
        resetBtn.style.background = 'rgba(239,68,68,0.4)';
        resetBtn.textContent = '🔄 Начать новую игру';
        resetBtn.onclick = function() {
            if (confirm('Начать новую игру? Текущий прогресс будет потерян.')) {
                clearGameState();
                location.reload();
            }
        };
        modal.querySelector('.setup-card').appendChild(resetBtn);
    } else {
        renderInputs();
    }
});

window.setPlayerCount = setPlayerCount;
window.startGame = startGame;
window.rollDice = rollDice;
window.completeTask = completeTask;
window.exitGame = exitGame;
window.resetGame = resetGame;
</script>
</body>
</html>
